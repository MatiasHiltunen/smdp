    <textarea id="src" spellcheck="false">\documentclass{article}
\begin{document}

\section{v0.2: Math box engine}
This version still writes PDF objects directly, but inline math is no longer emitted as plain text. It now parses formulas into temporary boxes and paints them into the PDF content stream.

Inline math: $E = mc^2$, $x_i^2 + y_i^2 = r^2$, and $\alpha + \beta \leq \gamma$.

\subsection{Display math}
\[
  \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}
\]

\begin{equation}
  \sum_{i=1}^{n} i = \frac{n(n+1)}{2}
\end{equation}

\subsection{Still supported}
Normal text, \textbf{bold}, \emph{italic}, lists, escaped characters like \%, \$, \&, \#, \_, \{ and \}, page breaks, and source-position warnings are still handled without external libraries.

\begin{itemize}
\item The parser is offset-based over the original source string.
\item Math formulas allocate only short-lived boxes for the current formula.
\item The PDF writer uses Base-14 fonts: Helvetica, Courier, and Symbol.
\end{itemize}

\end{document}</textarea>

  function measureText(text, style) {

  }

  class Renderer {
    constructor(src, warnings) {
      this.src = src;
      this.warnings = warnings;
      this.pageW = A4.w;
      this.pageH = A4.h;
      this.margin = 56;
      this.pages = [];
      this.stream = null;
      this.y = 0;
      this.line = null;
      this.pendingSpace = false;
      this.currentIndent = 0;
      this.newPage(false);
    }
    newPage(force) {
      if (this.line) this.flushLine();
      if (!force && this.stream && this.stream.length === 0) return;
      this.stream = [];
      this.pages.push(this.stream);
      this.y = this.pageH - this.margin;
      this.pendingSpace = false;

    textWidth() { return this.pageW - this.margin * 2; }
    availableWidth() {

    startLine() {

    pushTextItem(item, style) {
      this.line.items.push(item);
      this.line.width += item.width;

      this.line.maxBelow = Math.max(this.line.maxBelow, textDescent(style));

      this.startLine();
      const wordWidth = measureSpan(this.src, s, e, style);
      let leading = this.pendingSpace && this.line.items.length > 0;
      let spaceWidth = leading ? measureText(' ', style) : 0;
      if (this.line.items.length > 0 && this.line.width + spaceWidth + wordWidth > this.availableWidth()) {

        this.startLine();
        leading = false;
        spaceWidth = 0;
      }

      this.overPad = overPad;

      const childX = x + this.rootW;

      const depth = Math.max(base.depth, sub ? subShift + sub.depth : 0);

      this.sup = sup;
      this.sub = sub;
      this.supShift = supShift;
      this.subShift = subShift;
      this.gap = gap;

    paint(renderer, x, baseline) {
      this.base.paint(renderer, x, baseline);
      const sx = x + this.base.width + this.gap;

      if (this.sub) this.sub.paint(renderer, sx, baseline - this.subShift);

  const SYMBOL_CODES = Object.freeze({
    alpha: 0x61, beta: 0x62, gamma: 0x67, delta: 0x64, epsilon: 0x65, zeta: 0x7a,
    eta: 0x68, theta: 0x71, iota: 0x69, kappa: 0x6b, lambda: 0x6c, mu: 0x6d,
    nu: 0x6e, xi: 0x78, omicron: 0x6f, pi: 0x70, rho: 0x72, sigma: 0x73,
    tau: 0x74, upsilon: 0x75, phi: 0x66, chi: 0x63, psi: 0x79, omega: 0x77,
    Gamma: 0x47, Delta: 0x44, Theta: 0x51, Lambda: 0x4c, Xi: 0x58, Pi: 0x50,
    Sigma: 0x53, Upsilon: 0x55, Phi: 0x46, Psi: 0x59, Omega: 0x57,
    pm: 0xb1, mp: 0xb1, times: 0xb4, cdot: 0xd7, div: 0xb8, leq: 0xa3, geq: 0xb3,

  class MathParser {

      this.end = end;
      this.warnings = warnings;
      this.size = size || 12;
      this.opts = opts || {};

      this.digitFont = this.opts.digitFont || FONT.normal;
      this.operatorFont = this.opts.operatorFont || FONT.normal;

    style(font, scale) { return { font, size: this.size * (scale || 1), rise: 0 }; }

    parseSequence(stopOnBrace) {
      const children = [];
      let lastWasSpace = false;
      while (this.pos < this.end) {

        if (stopOnBrace && c === 125) break;
        if (c === 37) { this.skipComment(); continue; }

          this.skipSpaces();
          if (children.length && !lastWasSpace) children.push(new GlueBox(this.size * 0.22));
          lastWasSpace = true;

        const atom = this.parseAtom();
        if (atom) {

    skipComment() {
      while (this.pos < this.end && this.src.charCodeAt(this.pos) !== 10 && this.src.charCodeAt(this.pos) !== 13) this.pos++;

    skipSpaces() {
      while (this.pos < this.end && isSpaceCode(this.src.charCodeAt(this.pos))) this.pos++;

    skipSpacesAt(i) {
      while (i < this.end && isSpaceCode(this.src.charCodeAt(i))) i++;

    readGroupBounds(i) {

        const s = this.pos;
        while (this.pos < this.end && isAlpha(this.src.charCodeAt(this.pos))) this.pos++;

        while (this.pos < this.end && (isDigit(this.src.charCodeAt(this.pos)) || this.src.charCodeAt(this.pos) === 46)) this.pos++;

    parseScripts(base) {

      if (this.src.charCodeAt(this.pos) === 123) {
        const g = this.readGroupBounds(this.pos);
        this.pos = g.next;
        return new MathParser(this.src, g.start, g.end, this.warnings, scriptSize, this.opts).parse();

      const s = this.pos;

    }
    consumeOneAtomRange(i) {
      if (i >= this.end) return i;
      const c = this.src.charCodeAt(i);
      if (c === 123) {

      if (c !== 92) return Math.min(i + 1, this.end);

      if (i >= this.end) return i;

      return i;
    }
    parseCommand() {

      if (this.pos >= this.end) return new MathTextBox({ literal: '\\', style: this.style(FONT.mono, 1) });
      const c = this.src.charCodeAt(this.pos);
      if (!isAlpha(c)) {
        this.pos++;

        if (c === 59) return new GlueBox(this.size * 0.28);       // \;
        if (c === 33) return new GlueBox(-this.size * 0.12);      // \!

        if (c === 92) return new GlueBox(this.size * 0.5);        // line break in display math, approximate
        if (c === 123) return new MathTextBox({ literal: '{', style: this.style(this.operatorFont, 1) });
        if (c === 125) return new MathTextBox({ literal: '}', style: this.style(this.operatorFont, 1) });
        if (c === 37) return new MathTextBox({ literal: '%', style: this.style(this.operatorFont, 1) });
        if (c === 36) return new MathTextBox({ literal: '$', style: this.style(this.operatorFont, 1) });
        if (c === 38) return new MathTextBox({ literal: '&', style: this.style(this.operatorFont, 1) });
        if (c === 35) return new MathTextBox({ literal: '#', style: this.style(this.operatorFont, 1) });
        if (c === 95) return new MathTextBox({ literal: '_', style: this.style(this.operatorFont, 1) });

      while (this.pos < this.end && isAlpha(this.src.charCodeAt(this.pos))) this.pos++;

      if (name === 'frac') {

        const g = this.readRequiredGroup();
        if (!g) {
          this.warnings.push('Malformed \\sqrt near byte offset ' + slash + '.');
          return new MathTextBox({ literal: '\\sqrt', style: this.style(FONT.mono, 0.9) });
        }
        const r = new MathParser(this.src, g.start, g.end, this.warnings, this.size, this.opts).parse();
        return new SqrtBox(r, this.size);
      }
      if (name === 'text') {
        const g = this.readRequiredGroup();
        if (!g) return new MathTextBox({ literal: '\\text', style: this.style(FONT.mono, 0.9) });
        return new MathTextBox({ src: this.src, start: g.start, end: g.end, style: this.style(FONT.normal, 0.92) });
      }
      if (name === 'operatorname') {
        const g = this.readRequiredGroup();
        if (!g) return new MathTextBox({ literal: '\\operatorname', style: this.style(FONT.mono, 0.8) });
        const op = new MathTextBox({ src: this.src, start: g.start, end: g.end, style: this.style(FONT.normal, 1) });
        return new HBox([op, new GlueBox(this.size * 0.18)]);

      if (name === 'mathrm' || name === 'mathbf' || name === 'mathit' || name === 'mathtt') {
        const g = this.readRequiredGroup();
        if (!g) return new MathTextBox({ literal: '\\' + name, style: this.style(FONT.mono, 0.9) });

        return new MathParser(this.src, g.start, g.end, this.warnings, this.size, { letterFont: font, digitFont: font, operatorFont: font }).parse();
      }
      if (name === 'left' || name === 'right') {
        this.skipSpaces();
        return this.readDelimiter();

      if (name === 'quad') return new GlueBox(this.size * 1.0);
      if (name === 'qquad') return new GlueBox(this.size * 2.0);
      if (name === 'thinspace') return new GlueBox(this.size * 0.18);
      if (OPERATORS[name]) {

          new MathTextBox({ literal: name, style: this.style(FONT.normal, 1) }),
          new GlueBox(this.size * 0.18)

      if (Object.prototype.hasOwnProperty.call(SYMBOL_CODES, name)) {
        const larger = (name === 'sum' || name === 'prod' || name === 'int' || name === 'oint') ? 1.25 : 1;
        return new MathTextBox({ literal: String.fromCharCode(SYMBOL_CODES[name]), style: this.style(FONT.symbol, larger) });
      }
      if (name === 'to' || name === 'rightarrow') return new MathTextBox({ literal: '->', style: this.style(FONT.normal, 1) });
      if (name === 'leftarrow') return new MathTextBox({ literal: '<-', style: this.style(FONT.normal, 1) });
      if (name === 'ldots' || name === 'dots' || name === 'cdots') return new MathTextBox({ literal: '...', style: this.style(FONT.normal, 1) });

      this.warnings.push('Unsupported math command: \\' + name);

    readDelimiter() {

      const c = this.src.charCodeAt(this.pos);

      if (c !== 92) {
        this.pos++;
        return new MathTextBox({ literal: String.fromCharCode(c), style: this.style(this.operatorFont, 1) });
      }
      this.pos++;
      if (this.pos >= this.end) return new MathTextBox({ literal: '\\', style: this.style(FONT.mono, 1) });
      if (!isAlpha(this.src.charCodeAt(this.pos))) {
        const ch = this.src.charCodeAt(this.pos++);
        if (ch === 123) return new MathTextBox({ literal: '{', style: this.style(this.operatorFont, 1) });
        if (ch === 125) return new MathTextBox({ literal: '}', style: this.style(this.operatorFont, 1) });
        return new MathTextBox({ literal: String.fromCharCode(ch), style: this.style(this.operatorFont, 1) });
      }
      const ns = this.pos;
      while (this.pos < this.end && isAlpha(this.src.charCodeAt(this.pos))) this.pos++;
      const name = this.src.slice(ns, this.pos);
      if (name === 'lbrace') return new MathTextBox({ literal: '{', style: this.style(this.operatorFont, 1) });
      if (name === 'rbrace') return new MathTextBox({ literal: '}', style: this.style(this.operatorFont, 1) });
      if (name === 'vert' || name === 'mid') return new MathTextBox({ literal: '|', style: this.style(this.operatorFont, 1) });
      if (name === 'langle') return new MathTextBox({ literal: '<', style: this.style(this.operatorFont, 1) });
      if (name === 'rangle') return new MathTextBox({ literal: '>', style: this.style(this.operatorFont, 1) });
      return new MathTextBox({ literal: name, style: this.style(FONT.normal, 1) });
    }
  }

  class Compiler {
    constructor(src) {
      this.src = src;
      this.warnings = [];
      this.env = [];
      this.renderer = new Renderer(src, this.warnings);
    }
    compile() {
      let start = this.src.indexOf('\\begin{document}');
      if (start >= 0) start += '\\begin{document}'.length;
      else { start = 0; this.warnings.push('No \\begin{document}; compiling the entire input.'); }

    syncIndent() {

      let textStart = i;

          i = this.handleCommand(i + 1, end, style);
          textStart = i;
        } else if (c === 36) { // dollar math
          if (textStart < i) this.renderer.addSpan(textStart, i, style);

      while (i < end && this.src.charCodeAt(i) !== 10 && this.src.charCodeAt(i) !== 13) i++;

    skipSpaces(i, end) {
      while (i < end && isSpaceCode(this.src.charCodeAt(i))) i++;

    }
    skipOptional(i, end) {
      i = this.skipSpaces(i, end);
      if (this.src.charCodeAt(i) !== 91) return i;
      let depth = 1;
      i++;
      while (i < end && depth > 0) {
        const c = this.src.charCodeAt(i);
        if (c === 92) i += 2;

    }
    readGroup(i, end) {
      i = this.skipSpaces(i, end);
      if (this.src.charCodeAt(i) !== 123) return null;
      const start = i + 1;
      let depth = 1;
      i++;
      while (i < end && depth > 0) {
        const c = this.src.charCodeAt(i);
        if (c === 92) i += 2;
        else {
          if (c === 123) depth++;
          else if (c === 125) depth--;
          if (depth === 0) return { start, end: i, next: i + 1 };

    handleCommand(i, end, style) {
      if (i >= end) return i;
      const c = this.src.charCodeAt(i);
      if (!isAlpha(c)) return this.handleSymbolCommand(i, end, style);

    handleSymbolCommand(i, end, style) {
      const c = this.src.charCodeAt(i);
      if (c === 92) { this.renderer.lineBreak(); return i + 1; }       // \\
      if (c === 91) return this.handleBracketDisplay(i + 1, end, style); // \[
      if (c === 40) return this.handleParenInline(i + 1, end, style);    // \(
      if (c === 37) { this.renderer.addLiteral('%', style); return i + 1; }
      if (c === 36) { this.renderer.addLiteral('$', style); return i + 1; }
      if (c === 38) { this.renderer.addLiteral('&', style); return i + 1; }
      if (c === 35) { this.renderer.addLiteral('#', style); return i + 1; }
      if (c === 95) { this.renderer.addLiteral('_', style); return i + 1; }
      if (c === 123) { this.renderer.addLiteral('{', style); return i + 1; }
      if (c === 125) { this.renderer.addLiteral('}', style); return i + 1; }
      if (c === 126) { this.renderer.addLiteral(' ', style); return i + 1; }
      if (c === 94) { this.renderer.addLiteral('^', style); return i + 1; }
      return i + 1;
    }
    cmd(s, e, word) { return spanEq(this.src, s, e, word); }
    handleNamedCommand(ns, ne, pos, end, style) {
      const nameForWarn = this.src.slice(ns, ne);

      if (this.cmd(ns, ne, 'section') || this.cmd(ns, ne, 'subsection') || this.cmd(ns, ne, 'subsubsection')) {
        pos = this.skipOptional(pos, end);
        const g = this.readGroup(pos, end);
        if (!g) return pos;
        const oldIndent = this.renderer.currentIndent;
        this.renderer.currentIndent = 0;
        this.renderer.paragraph(this.cmd(ns, ne, 'section') ? 14 : 10);
        const size = this.cmd(ns, ne, 'section') ? 20 : (this.cmd(ns, ne, 'subsection') ? 16 : 14);
        this.parseRange(g.start, g.end, styleWith(style, { font: FONT.bold, size }));
        this.renderer.paragraph(8);
        this.renderer.currentIndent = oldIndent;
        return g.next;
      }
      if (this.cmd(ns, ne, 'textbf') || this.cmd(ns, ne, 'bfseries')) {
        const g = this.readGroup(pos, end);
        if (g) { this.parseRange(g.start, g.end, styleWith(style, { font: FONT.bold })); return g.next; }
        return pos;
      }
      if (this.cmd(ns, ne, 'textit') || this.cmd(ns, ne, 'emph') || this.cmd(ns, ne, 'itshape')) {
        const g = this.readGroup(pos, end);
        if (g) { this.parseRange(g.start, g.end, styleWith(style, { font: FONT.italic })); return g.next; }
        return pos;
      }
      if (this.cmd(ns, ne, 'texttt')) {
        const g = this.readGroup(pos, end);
        if (g) { this.parseRange(g.start, g.end, styleWith(style, { font: FONT.mono })); return g.next; }
        return pos;
      }
      if (this.cmd(ns, ne, 'begin')) {
        const g = this.readGroup(pos, end);
        if (!g) return pos;
        const envName = this.src.slice(g.start, g.end).trim();
        if (envName === 'itemize') { this.renderer.paragraph(4); this.env.push({ type: 'itemize', count: 0 }); this.syncIndent(); }
        else if (envName === 'enumerate') { this.renderer.paragraph(4); this.env.push({ type: 'enumerate', count: 0 }); this.syncIndent(); }
        else if (envName === 'equation' || envName === 'displaymath') {
          const close = this.findEndEnvironment(envName, g.next, end);
          if (close) {
            this.renderDisplayMathRange(g.next, close.start, style);
            return close.next;
          }
          this.warnings.push('Unclosed math environment: ' + envName);
          this.renderDisplayMathRange(g.next, end, style);
          return end;
        }
        else if (envName === 'document') { /* already handled */ }
        else this.warnings.push('Unsupported environment started: ' + envName);
        return g.next;
      }
      if (this.cmd(ns, ne, 'end')) {
        const g = this.readGroup(pos, end);
        if (!g) return pos;
        if (spanTrimEq(this.src, g.start, g.end, 'itemize') || spanTrimEq(this.src, g.start, g.end, 'enumerate')) {
          this.renderer.paragraph(4);
          this.env.pop();
          this.syncIndent();
        }
        return g.next;
      }
      if (this.cmd(ns, ne, 'item')) {
        this.renderer.paragraph(2);
        const top = this.env[this.env.length - 1];
        if (top && top.type === 'enumerate') { top.count++; this.syncIndent(); this.renderer.addLiteral(String(top.count) + '. ', style); }
        else { if (top) top.count++; this.syncIndent(); this.renderer.addLiteral('* ', style); }
        return pos;
      }
      if (this.cmd(ns, ne, 'par')) { this.renderer.paragraph(8); return pos; }
      if (this.cmd(ns, ne, 'newline') || this.cmd(ns, ne, 'linebreak')) { this.renderer.lineBreak(); return pos; }
      if (this.cmd(ns, ne, 'newpage') || this.cmd(ns, ne, 'clearpage')) { this.renderer.newPage(true); return pos; }
      if (this.cmd(ns, ne, 'noindent')) { this.renderer.currentIndent = 0; return pos; }
      if (this.cmd(ns, ne, 'textbackslash')) { this.renderer.addLiteral('\\', style); return pos; }
      if (this.cmd(ns, ne, 'LaTeX')) { this.renderer.addLiteral('LaTeX', style); return pos; }
      if (this.cmd(ns, ne, 'TeX')) { this.renderer.addLiteral('TeX', style); return pos; }
      if (this.cmd(ns, ne, 'ldots') || this.cmd(ns, ne, 'dots')) { this.renderer.addLiteral('...', style); return pos; }
      if (this.cmd(ns, ne, 'quad')) { this.renderer.addLiteral('    ', style); return pos; }
      if (this.cmd(ns, ne, 'qquad')) { this.renderer.addLiteral('        ', style); return pos; }
      if (this.cmd(ns, ne, 'alpha') || this.cmd(ns, ne, 'beta') || this.cmd(ns, ne, 'gamma') || this.cmd(ns, ne, 'delta') || this.cmd(ns, ne, 'pi') || this.cmd(ns, ne, 'theta') || this.cmd(ns, ne, 'lambda') || this.cmd(ns, ne, 'mu') || this.cmd(ns, ne, 'sigma') || this.cmd(ns, ne, 'omega')) {
        this.renderer.addLiteral(nameForWarn, style);
        return pos;
      }
      if (this.cmd(ns, ne, 'frac')) {
        const g1 = this.readGroup(pos, end);
        const g2 = g1 ? this.readGroup(g1.next, end) : null;
        if (g1 && g2) {
          this.renderer.addLiteral('(', style);
          this.parseRange(g1.start, g1.end, style);
          this.renderer.addLiteral(')/(', style);
          this.parseRange(g2.start, g2.end, style);
          this.renderer.addLiteral(')', style);
          return g2.next;
        }
        return pos;
      }
      if (this.cmd(ns, ne, 'includegraphics')) {
        pos = this.skipOptional(pos, end);
        const g = this.readGroup(pos, end);
        this.renderer.addLiteral('[image omitted]', styleWith(style, { font: FONT.italic }));
        return g ? g.next : pos;
      }
      if (this.cmd(ns, ne, 'href')) {
        const url = this.readGroup(pos, end);
        const label = url ? this.readGroup(url.next, end) : null;
        if (label) { this.parseRange(label.start, label.end, style); return label.next; }
        return url ? url.next : pos;
      }
      if (this.cmd(ns, ne, 'url')) {
        const g = this.readGroup(pos, end);
        if (g) { this.parseRange(g.start, g.end, styleWith(style, { font: FONT.mono })); return g.next; }
        return pos;
      }

      this.warnings.push('Ignored unsupported command: \\' + nameForWarn);
      return pos;
    }
    findEndEnvironment(envName, start, end) {
      const needle = '\\end{' + envName + '}';
      const idx = this.src.indexOf(needle, start);
      if (idx < 0 || idx >= end) return null;
      return { start: idx, next: idx + needle.length };
    }
    findInlineDollar(start, end) {
      let j = start;
      while (j < end) {
        const c = this.src.charCodeAt(j);
        if (c === 92) j += 2;
        else if (c === 36) return j;
        else j++;
      }
      return -1;
    }
    findDoubleDollar(start, end) {
      let j = start;
      while (j < end - 1) {
        const c = this.src.charCodeAt(j);
        if (c === 92) j += 2;
        else if (c === 36 && this.src.charCodeAt(j + 1) === 36) return j;
        else j++;
      }
      return -1;
    }
    findBracketMathEnd(start, end, closeChar) {
      let j = start;
      while (j < end - 1) {
        if (this.src.charCodeAt(j) === 92 && this.src.charCodeAt(j + 1) === closeChar) return j;
        j++;
      }
      return -1;
    }
    renderInlineMathRange(start, stop, outerStyle) {
      const size = Math.max(8, outerStyle.size || 12);
      const box = new MathParser(this.src, start, stop, this.warnings, size, null).parse();
      this.renderer.addBox(box);
    }
    renderDisplayMathRange(start, stop, outerStyle) {
      const size = Math.max(13, (outerStyle.size || 12) * 1.15);
      const box = new MathParser(this.src, start, stop, this.warnings, size, null).parse();
      this.renderer.addDisplayBox(box);
    }
    handleInlineMath(start, end, outerStyle) {
      const stop = this.findInlineDollar(start, end);
      if (stop < 0) { this.renderer.addLiteral('$', outerStyle); return start; }
      this.renderInlineMathRange(start, stop, outerStyle);
      return stop + 1;
    }
    handleDollarDisplay(start, end, outerStyle) {
      const stop = this.findDoubleDollar(start, end);
      if (stop < 0) { this.renderer.addLiteral('$$', outerStyle); return start; }
      this.renderDisplayMathRange(start, stop, outerStyle);
      return stop + 2;
    }
    handleBracketDisplay(start, end, outerStyle) {
      const stop = this.findBracketMathEnd(start, end, 93); // ]
      if (stop < 0) { this.renderer.addLiteral('\\[', outerStyle); return start; }
      this.renderDisplayMathRange(start, stop, outerStyle);
      return stop + 2;
    }
    handleParenInline(start, end, outerStyle) {
      const stop = this.findBracketMathEnd(start, end, 41); // )
      if (stop < 0) { this.renderer.addLiteral('\\(', outerStyle); return start; }
      this.renderInlineMathRange(start, stop, outerStyle);
      return stop + 2;
    }
  }

  function buildPdf(pageStreams) {
    const objects = [];
    const put = (s) => { objects.push(s); return objects.length; };
    put('<< /Type /Catalog /Pages 2 0 R >>');       // 1
    put('');                                         // 2, filled later
    put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>');
    put('<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>');
    put('<< /Type /Font /Subtype /Type1 /BaseFont /Symbol >>');

    const kids = [];
    for (const stream of pageStreams) {
      const contentNo = put('<< /Length ' + stream.length + ' >>\nstream\n' + stream + 'endstream');
      const pageNo = put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + fmt(A4.w) + ' ' + fmt(A4.h) + '] ' +
        '/Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R /F5 7 0 R >> >> ' +
        '/Contents ' + contentNo + ' 0 R >>');
      kids.push(pageNo + ' 0 R');
    }
    objects[1] = '<< /Type /Pages /Count ' + kids.length + ' /Kids [' + kids.join(' ') + '] >>';

    let pdf = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
    const offsets = [0];
    for (let i = 0; i < objects.length; i++) {
      offsets.push(pdf.length);
      pdf += (i + 1) + ' 0 obj\n' + objects[i] + '\nendobj\n';
    }
    const xrefOffset = pdf.length;
    pdf += 'xref\n0 ' + (objects.length + 1) + '\n';
    pdf += '0000000000 65535 f \n';
    for (let i = 1; i < offsets.length; i++) pdf += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    pdf += 'trailer\n<< /Size ' + (objects.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF\n';

    const out = new Uint8Array(pdf.length);
    for (let i = 0; i < pdf.length; i++) out[i] = pdf.charCodeAt(i) & 255;
    return out;
  }

  function compileLatexToPdf(src) {
    return new Compiler(src).compile();
  }
  function compileSource(src) {
    return compileLatexToPdf(src);
  }

  const api = { VERSION: 'v0.2', Compiler, compileLatexToPdf, compileSource, buildPdf };
  global.ZeroLatexPDF = api;
  global.ZeroLatexCompiler = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(() => {
  'use strict';
  let currentUrl = null;
  function compileNow() {
    const src = document.getElementById('src').value;
    const log = document.getElementById('log');
    const preview = document.getElementById('preview');
    const download = document.getElementById('download');
    try {
      const result = ZeroLatexPDF.compileLatexToPdf(src);
      const blob = new Blob([result.bytes], { type: 'application/pdf' });
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(blob);
      preview.src = currentUrl;
      download.href = currentUrl;
      download.hidden = false;
      log.textContent = 'Compiled ' + result.pages + ' page(s), ' + result.bytes.length + ' bytes.\n' +
        (result.warnings.length ? '\nWarnings:\n- ' + result.warnings.join('\n- ') : 'No warnings.');
    } catch (err) {
      log.textContent = 'Compiler error:\n' + (err && err.stack ? err.stack : String(err));
    }
  }
  document.getElementById('compile').addEventListener('click', compileNow);
  compileNow();
})();
</script>
